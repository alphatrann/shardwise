<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>shardwise architecture</title>
<rect width="720" height="470" rx="12" fill="#ffffff" stroke="#d4d4d8"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs>
<g text-anchor="middle" fill="#18181b">
<rect x="230" y="20" width="260" height="46" rx="8" fill="#f4f4f5" stroke="#a1a1aa"/>
<text x="360" y="40" font-size="14" font-weight="700">Your code</text>
<text x="360" y="57" font-size="12" fill="#52525b">route · execute · executeAll</text>

<rect x="40" y="100" width="640" height="210" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="360" y="122" font-size="14" font-weight="700" fill="#1d4ed8">Router</text>

<rect x="60" y="138" width="190" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
<text x="155" y="160" font-size="13" font-weight="700">HashRing</text>
<text x="155" y="178" font-size="11.5" fill="#52525b">AVL tree: point → node id</text>
<text x="155" y="194" font-size="11.5" fill="#52525b">clockwise lookup, O(log n)</text>
<text x="155" y="210" font-size="11.5" fill="#52525b">per-node vnode weights</text>

<rect x="265" y="138" width="190" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
<text x="360" y="160" font-size="13" font-weight="700">NodeRegistry</text>
<text x="360" y="178" font-size="11.5" fill="#52525b">node id → config + client</text>
<text x="360" y="194" font-size="11.5" fill="#52525b">the live set</text>

<rect x="470" y="138" width="190" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
<text x="565" y="160" font-size="13" font-weight="700">withRetry</text>
<text x="565" y="178" font-size="11.5" fill="#52525b">exponential backoff</text>
<text x="565" y="194" font-size="11.5" fill="#52525b">used by addNode</text>

<rect x="60" y="232" width="285" height="64" rx="8" fill="#fff" stroke="#2563eb"/>
<text x="202" y="254" font-size="13" font-weight="700">HealthMonitor</text>
<text x="202" y="272" font-size="11.5" fill="#52525b">probes nodes on an interval</text>
<text x="202" y="287" font-size="11.5" fill="#52525b">N misses → markDown</text>

<rect x="375" y="232" width="285" height="64" rx="8" fill="#fff" stroke="#2563eb"/>
<text x="517" y="254" font-size="13" font-weight="700">Reconnector</text>
<text x="517" y="272" font-size="11.5" fill="#52525b">retries downed nodes</text>
<text x="517" y="287" font-size="11.5" fill="#52525b">with backoff, same weight</text>

<rect x="140" y="345" width="440" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="360" y="366" font-size="14" font-weight="700" fill="#92400e">Your client factory</text>
<text x="360" y="384" font-size="12" fill="#78350f">connect(node) · disconnect(client) · checker.check(client)</text>

<rect x="60" y="425" width="170" height="30" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/><text x="145" y="445" font-size="12">10.0.0.1:6379</text>
<rect x="275" y="425" width="170" height="30" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/><text x="360" y="445" font-size="12">10.0.0.2:6379</text>
<rect x="490" y="425" width="170" height="30" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/><text x="575" y="445" font-size="12">10.0.0.3:6379</text>
</g>
<g stroke="#52525b" stroke-width="1.6" fill="none" marker-end="url(#a)">
<path d="M360,66 L360,100"/><path d="M360,310 L360,345"/>
<path d="M250,397 L160,425"/><path d="M360,397 L360,425"/><path d="M470,397 L560,425"/>
</g>
</svg>
